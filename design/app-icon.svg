<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- FM1 app icon: the FM-1 seen from the front. A square screen with a step pattern in SLOOP's track
       colours, the four knobs (blue, green, yellow, red, as on the device), a key strip. Full bleed:
       iOS rounds the corners. Source for ios/FM1/Assets.xcassets/AppIcon.appiconset/icon-1024.png -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B31"/>
      <stop offset="1" stop-color="#16161A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A4A53"/>
      <stop offset="1" stop-color="#2A2A30"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F2F5"/>
      <stop offset="1" stop-color="#C9C9D0"/>
    </linearGradient>
    <filter id="sink" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dy="6"/><feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceAlpha" in2="b" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feFlood flood-color="#000" flood-opacity="0.8"/><feComposite in2="inner" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#body)"/>
  <!-- the top edge catching light -->
  <rect x="0" y="0" width="1024" height="6" fill="#FFFFFF" opacity="0.06"/>

  <!-- the screen, set into the case -->
  <rect x="96" y="112" width="440" height="440" rx="34" fill="#08080A" filter="url(#sink)"/>
  <g>
    <g fill="#1C1C21"><rect x="128" y="156" width="40" height="76" rx="9"/><rect x="176" y="156" width="40" height="76" rx="9"/><rect x="224" y="156" width="40" height="76" rx="9"/><rect x="272" y="156" width="40" height="76" rx="9"/><rect x="320" y="156" width="40" height="76" rx="9"/><rect x="368" y="156" width="40" height="76" rx="9"/><rect x="416" y="156" width="40" height="76" rx="9"/><rect x="464" y="156" width="40" height="76" rx="9"/><rect x="128" y="248" width="40" height="76" rx="9"/><rect x="176" y="248" width="40" height="76" rx="9"/><rect x="224" y="248" width="40" height="76" rx="9"/><rect x="272" y="248" width="40" height="76" rx="9"/><rect x="320" y="248" width="40" height="76" rx="9"/><rect x="368" y="248" width="40" height="76" rx="9"/><rect x="416" y="248" width="40" height="76" rx="9"/><rect x="464" y="248" width="40" height="76" rx="9"/><rect x="128" y="340" width="40" height="76" rx="9"/><rect x="176" y="340" width="40" height="76" rx="9"/><rect x="224" y="340" width="40" height="76" rx="9"/><rect x="272" y="340" width="40" height="76" rx="9"/><rect x="320" y="340" width="40" height="76" rx="9"/><rect x="368" y="340" width="40" height="76" rx="9"/><rect x="416" y="340" width="40" height="76" rx="9"/><rect x="464" y="340" width="40" height="76" rx="9"/><rect x="128" y="432" width="40" height="76" rx="9"/><rect x="176" y="432" width="40" height="76" rx="9"/><rect x="224" y="432" width="40" height="76" rx="9"/><rect x="272" y="432" width="40" height="76" rx="9"/><rect x="320" y="432" width="40" height="76" rx="9"/><rect x="368" y="432" width="40" height="76" rx="9"/><rect x="416" y="432" width="40" height="76" rx="9"/><rect x="464" y="432" width="40" height="76" rx="9"/></g>
    <g fill="#287CFF"><rect x="128" y="156" width="40" height="76" rx="9"/><rect x="272" y="156" width="40" height="76" rx="9"/><rect x="320" y="156" width="40" height="76" rx="9"/></g>
    <g fill="#1ECC70"><rect x="176" y="248" width="40" height="76" rx="9"/><rect x="416" y="248" width="40" height="76" rx="9"/></g>
    <g fill="#FFC618"><rect x="224" y="340" width="40" height="76" rx="9"/><rect x="272" y="340" width="40" height="76" rx="9"/><rect x="464" y="340" width="40" height="76" rx="9"/></g>
    <g fill="#FF621A"><rect x="128" y="432" width="40" height="76" rx="9"/><rect x="224" y="432" width="40" height="76" rx="9"/><rect x="320" y="432" width="40" height="76" rx="9"/><rect x="464" y="432" width="40" height="76" rx="9"/></g>
    <rect x="314" y="144" width="4" height="376" rx="2" fill="#FFFFFF" opacity="0.85"/>
  </g>
  <!-- the four knobs: blue, green, yellow, red, each ring lit from the start to its needle -->
  <g stroke-linecap="round" fill="none">
    <circle cx="658" cy="232" r="72" stroke="#000" stroke-opacity="0.35" stroke-width="20"/>
    <path d="M 607.1 282.9 A 72 72 0 0 1 708.9 181.1" stroke="#287CFF" stroke-width="20"/>
    <circle cx="846" cy="232" r="72" stroke="#000" stroke-opacity="0.35" stroke-width="20"/>
    <path d="M 795.1 282.9 A 72 72 0 0 1 774.0 232.0" stroke="#1ECC70" stroke-width="20"/>
    <circle cx="658" cy="432" r="72" stroke="#000" stroke-opacity="0.35" stroke-width="20"/>
    <path d="M 607.1 482.9 A 72 72 0 1 1 730.0 432.0" stroke="#FFC618" stroke-width="20"/>
    <circle cx="846" cy="432" r="72" stroke="#000" stroke-opacity="0.35" stroke-width="20"/>
    <path d="M 795.1 482.9 A 72 72 0 1 1 846.0 504.0" stroke="#FF2C34" stroke-width="20"/>
  </g>
  <g filter="url(#lift)">
    <circle cx="658" cy="232" r="50" fill="url(#cap)"/>
    <circle cx="846" cy="232" r="50" fill="url(#cap)"/>
    <circle cx="658" cy="432" r="50" fill="url(#cap)"/>
    <circle cx="846" cy="432" r="50" fill="url(#cap)"/>
  </g>
  <g stroke="#EDEDF0" stroke-width="11" stroke-linecap="round">
    <line x1="658" y1="232" x2="683.5" y2="206.5"/>
    <line x1="846" y1="232" x2="810.0" y2="232.0"/>
    <line x1="658" y1="432" x2="694.0" y2="432.0"/>
    <line x1="846" y1="432" x2="846.0" y2="468.0"/>
  </g>
  <!-- the keys -->
  <rect x="96" y="640" width="832" height="290" rx="30" fill="#0C0C0E" filter="url(#sink)"/>
  <g fill="url(#key)" filter="url(#lift)"><rect x="120.0" y="664" width="87.5" height="242" rx="14"/><rect x="219.5" y="664" width="87.5" height="242" rx="14"/><rect x="319.0" y="664" width="87.5" height="242" rx="14"/><rect x="418.5" y="664" width="87.5" height="242" rx="14"/><rect x="518.0" y="664" width="87.5" height="242" rx="14"/><rect x="617.5" y="664" width="87.5" height="242" rx="14"/><rect x="717.0" y="664" width="87.5" height="242" rx="14"/><rect x="816.5" y="664" width="87.5" height="242" rx="14"/></g>
  <g fill="#1A1A1E"><rect x="184.5" y="664" width="58" height="140" rx="10"/><rect x="284.0" y="664" width="58" height="140" rx="10"/><rect x="483.0" y="664" width="58" height="140" rx="10"/><rect x="582.5" y="664" width="58" height="140" rx="10"/><rect x="682.0" y="664" width="58" height="140" rx="10"/></g>
</svg>
