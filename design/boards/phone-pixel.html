<!doctype html>
<!-- Lupe on a Pixel 10 Pro: a clickable phone mock. v1 2026-11-12: landscape = boards 46–50 (Pads · Edit · Mix · Sounds); portrait = two stacked panes, Pads/Mix/Sounds above and the pattern as a 4 × 4 step grid below. v2 2026-11-12: editing. Drums by step (lane toggles for the picked step) or by lane; a one-octave piano with Chord (up to 4 notes); − / + for pitch, move, length and velocity in the step panel; hold a pad for "Edit steps" (selects without launching, opens Edit with the panel). Nothing talks to the FM-1. Published copy: https://claude.ai/artifact/1pEcMyaYggSUbCHc4xwNYD (private). Screens in phone-pixel/. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>
<title>Lupe on Pixel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* Layout: one screen, no page scroll.
   Landscape = Lupe's phone with a Skiff FM-1 (boards 46–50): a 44 pt top bar, then one job a tab (Pads · Edit · Mix · Sounds).
   Portrait  = two stacked panes, like two FM-1 screens: Pads / Mix / Sounds above, the pattern's 16 steps as a 4 × 4 below.
   Colours and sizes are Lupe's own (tokens/tokens.json, design/boards/phone-skiff.html). Lupe is dark-only, so one theme. */
:root {
  --page: #0D0D0F; --well: #111114; --panel: #1A1A1E; --control: #26262B; --lifted: #34343B; --held: #3E3E46;
  --edge: #0A0A0C; --empty: #2A2A30; --outside: #18181C; --outline: #4A4A52;
  --text: #EDEDF0; --text2: #A1A1AA; --text2r: #C4C4CC; --text3: #71717A; --on: #101012; --rec: #FF2C34; --bar: #3A3A42;
  --f-word: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-num: 'Barlow Condensed', 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.4, 0, 1, 1);
  --t-state: 150ms; --t-finger: 200ms; --t-panel: 300ms;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 400 14px/1.3 var(--f-word); font-variant-numeric: tabular-nums;
  overflow: hidden; padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; margin: 0; padding: 0; background: none; cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
[hidden] { display: none !important; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.app { height: 100%; max-width: 1100px; margin: 0 auto; padding-block: 8px; display: flex; flex-direction: column; gap: 8px; animation: fade var(--t-state) var(--ease-out); }
.app.narrow { max-width: 430px; }
.spacer { flex: 1 1 auto; min-width: 0; }

/* the chiclet key: a flat top on a hard 2 pt base edge; pressed moves the top down onto it */
.key {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--control); color: var(--text); border-radius: 8px; box-shadow: 0 2px 0 var(--edge);
  font-weight: 600; font-size: 14px;
  transition: background-color var(--t-state), color var(--t-state), box-shadow 100ms, transform 100ms;
}
.key:active { transform: translateY(2px); box-shadow: 0 0 0 var(--edge); transition-duration: 60ms; }
.key[aria-pressed="true"], .key.lit { background: var(--text); color: var(--on); }
.key:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--empty); color: var(--text3); cursor: default; transform: none; }
.well { background: var(--well); border-radius: 10px; padding: 4px; display: flex; gap: 2px; }

/* top bar */
.top { flex: none; height: 44px; display: flex; gap: 8px; }
.chip {
  flex: none; width: 44px; border-radius: 8px; background: var(--c); color: var(--on);
  box-shadow: inset 0 0 0 2px var(--text); font: 600 22px/1 var(--f-num);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  transition: background-color var(--t-state);
}
.chip::after { content: ""; width: 14px; height: 3px; border-radius: 2px; background: rgba(16, 16, 18, .5); }
.tabs { flex: 1 1 auto; min-width: 0; }
.tab { flex: 1 1 0; min-width: 0; border-radius: 6px; font-weight: 600; font-size: 14px; color: var(--text2); transition: background-color var(--t-state), color var(--t-state), box-shadow var(--t-state); }
.tab[aria-selected="true"], .tab[aria-pressed="true"] { background: var(--control); color: var(--text); box-shadow: 0 2px 0 var(--edge); }
.launch { flex: none; height: 44px; padding: 0 12px; white-space: nowrap; }
.launch small { font-size: 13px; font-weight: 400; color: var(--text2r); transition: color var(--t-state); }
.transport { flex: none; align-items: center; padding-right: 10px; }
.recb { width: 40px; height: 36px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
.recb i { width: 14px; height: 14px; border-radius: 50%; background: var(--rec); transition: box-shadow var(--t-state); }
.recb[aria-pressed="true"] i { box-shadow: 0 0 0 3px var(--well), 0 0 0 5px var(--rec); }
.playb { width: 40px; height: 34px; border-radius: 6px; }
.pos { padding-left: 8px; min-width: 56px; line-height: 1.15; }
.pos b { display: block; font: 600 16px/1.1 var(--f-num); }
.pos span { font-size: 11px; color: var(--text2); }
.more { flex: none; width: 44px; height: 42px; }

/* sliding pages: something moves, so it travels */
.stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; }
.slider { display: flex; height: 100%; transition: transform var(--t-panel) var(--ease-out); }
.slider > .view { flex: 0 0 100%; min-width: 0; height: 100%; position: relative; display: flex; flex-direction: column; gap: 8px; }

/* portrait panes: two FM-1 screens, one above the other */
.panes { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.pane { flex: 1 1 0; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--well); border-radius: 16px; overflow: hidden; }
.pane.upper { border-radius: 18px 18px 16px 16px; }
.ptabs { flex: none; height: 40px; background: var(--page); }

/* Pads: one row a track, one column an entry */
.pads { --bgk: var(--page); flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.portrait .pads { --bgk: var(--well); }
.padscroll { flex: 1 1 auto; min-height: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
.padscroll::-webkit-scrollbar { display: none; }
.padgrid { --headw: 72px; --padw: 78px; display: grid; height: 100%; width: max-content; gap: 4px; padding: 2px 2px 2px 0; grid-template-rows: repeat(6, minmax(28px, 1fr)); }
.rowbg { z-index: 0; margin: -2px 0; border-radius: 10px; transition: background-color var(--t-state); }
.rowbg.sel { background: color-mix(in srgb, var(--c) 16%, transparent); }
.head {
  position: sticky; left: 0; z-index: 3; display: flex; align-items: center; gap: 4px;
  margin: -2px -4px -2px 0; padding: 2px 4px 2px 2px; border-radius: 10px 0 0 10px;
  background: var(--bgk); transition: background-color var(--t-state);
}
.head.sel { background: color-mix(in srgb, var(--c) 16%, var(--bgk)); }
.num { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--c); color: var(--on); font: 600 17px/1 var(--f-num); transition: box-shadow var(--t-state); }
.num.sel { box-shadow: 0 0 0 2px var(--text); }
.mute { flex: none; width: 32px; height: 32px; font-size: 13px; color: var(--text2r); }
.pad {
  --ri: 0 0 #0000; --ro: 0 0 #0000;
  position: relative; z-index: 1; min-width: 0; overflow: hidden;
  display: flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 8px;
  background: var(--control); color: var(--text); text-align: left; box-shadow: var(--ri), var(--ro);
  transition: background-color var(--t-state), color var(--t-state), box-shadow var(--t-state);
}
.pad .pn { flex: none; font: 600 17px/1 var(--f-num); }
.pad .pr { flex: none; font-size: 11px; color: var(--text2); white-space: nowrap; transition: color var(--t-state); }
.portrait .pad.pass .pr { display: none; }
.pad .pp { margin-left: auto; font: 600 12px/1 var(--f-num); }
.pad .wb { margin-left: auto; padding: 2px 4px 1px; border-radius: 5px; background: var(--text); color: var(--on); font: 600 11px/1 var(--f-num); display: none; }
.pad .pb { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 3px; border-radius: 2px; background: rgba(16, 16, 18, .3); opacity: 0; transition: opacity var(--t-state); }
.pad .pb i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--on); }
.pad.rest { background: transparent; --ri: inset 0 0 0 1px var(--outline); }
.pad.rest .pn { font: 600 12px/1 var(--f-word); color: var(--text2); }
.pad.snd { clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%); }
.pad.cur { background: var(--c); color: var(--on); }
.pad.cur .pr, .pad.cur.rest .pn { color: var(--on); }
.pad.cur .pb { opacity: 1; }
.pad.cur.muted { background: var(--control); color: var(--text); --ri: inset 0 0 0 2px var(--c); }
.pad.cur.muted .pr { color: var(--text2); }
.pad.cur.muted .pb { background: var(--bar); }
.pad.cur.muted .pb i { background: var(--c); }
.pad.wait { outline: 2px dashed var(--c); outline-offset: -2px; }
.pad.wait:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; } /* focus wins; the label still says "waiting" */
.pad.wait .wb { display: block; }
.pad.wait .pp { display: none; }
.pad.sel { --ro: 0 0 0 2px var(--text); }
.cell-empty { z-index: 1; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--empty); }
.scenes { flex: none; height: 36px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.scenes::-webkit-scrollbar { display: none; }
.scenes .key { flex: 1 0 32px; height: 34px; font-size: 13px; }
.scenes .store { flex: 0 0 56px; }
.scenes .unkept { background: transparent; box-shadow: inset 0 0 0 1px var(--empty); color: var(--text2); }

/* Edit */
.editor { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 8px; }
.ruler { flex: none; height: 36px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.rchip { flex: none; width: 28px; height: 28px; border-radius: 7px; background: var(--c); color: var(--on); font: 600 16px/1 var(--f-num); display: flex; align-items: center; justify-content: center; }
.rtitle { font-size: 16px; font-weight: 600; white-space: nowrap; }
.rsub { font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ruler .key { flex: none; height: 34px; padding: 0 12px; }
.ebody { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; animation: fade var(--t-state) var(--ease-out); }
.empty-state { margin: auto; max-width: 34ch; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; }
.empty-state b { font-size: 16px; font-weight: 600; }
.empty-state p { margin: 0; color: var(--text2); font-size: 14px; line-height: 1.5; }
.empty-state .key { height: 44px; padding: 0 16px; margin-top: 8px; }

.rollscroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; border-radius: 8px; scrollbar-width: thin; }
.rollgrid { --lw: 48px; --rh: 44px; position: relative; display: grid; grid-template-columns: var(--lw) repeat(16, 1fr); grid-auto-rows: calc(var(--rh) - 1px); row-gap: 1px; background: var(--page); }
.rl { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 13px; color: var(--text2); background: var(--page); }
.rc { position: relative; background: var(--well); transition: background-color var(--t-state); }
.rc.alt { background: var(--outside); }
.rc.scol { background: var(--panel); }
.rc.hit::after, .rc.selc::before { content: ""; position: absolute; inset: 5px 3px; border-radius: 6px; }
.rc.hit::after { background: var(--c); animation: fade var(--t-state) var(--ease-out); }
.rc.selc::before { inset: 3px 1px; border-radius: 8px; box-shadow: 0 0 0 2px var(--text); z-index: 1; }
.note {
  position: absolute; pointer-events: none; z-index: 1; height: calc(var(--rh) - 9px); border-radius: 8px; background: var(--c);
  top: calc(var(--r) * var(--rh) + 4px);
  left: calc(var(--lw) + (100% - var(--lw)) * var(--s) / 16 + 2px);
  width: calc((100% - var(--lw)) * var(--l) / 16 - 4px);
  transition: top var(--t-finger) var(--ease-out), left var(--t-finger) var(--ease-out), width var(--t-finger) var(--ease-out), box-shadow var(--t-state), opacity 120ms var(--ease-in);
}
.note.sel { box-shadow: 0 0 0 2px var(--text); }
.note { opacity: var(--v, 1); } /* softer notes read lighter */
.note.off { display: none; } /* a pitch outside the roll's range */
.pad { -webkit-touch-callout: none; }
.note.enter { animation: noteIn var(--t-state) var(--ease-out); }
.note.leave { opacity: 0; }
@keyframes noteIn { from { opacity: 0; transform: scale(.9); } }
.playhead { position: absolute; z-index: 2; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text2r); pointer-events: none; left: calc(var(--lw) + (100% - var(--lw)) * var(--p) / 16); }

.g4 { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 4px; }
.sc {
  --ph: 0 0 #0000; --ro: 0 0 #0000;
  position: relative; min-width: 0; min-height: 0; border-radius: 8px; background: var(--empty); color: var(--text);
  display: flex; align-items: center; justify-content: center; box-shadow: var(--ph), var(--ro);
  transition: background-color var(--t-state), color var(--t-state), box-shadow var(--t-state);
}
.sc .sn { position: absolute; left: 8px; top: 6px; font-size: 11px; color: var(--text2); transition: color var(--t-state); }
.sc .sv { font: 600 22px/1 var(--f-num); }
.sc.on { background: var(--c); color: var(--on); }
.sc.on .sn { color: var(--on); }
.sc.hold { background: color-mix(in srgb, var(--c) 22%, var(--empty)); }
.sc.hold .sn { color: var(--text2r); }
.sc.ph { --ph: inset 0 -4px 0 var(--text); }
.sc.sel { --ro: 0 0 0 2px var(--text); }
.sc .dots { position: absolute; right: 7px; top: 7px; display: grid; grid-template-columns: repeat(4, 5px); gap: 2px; }
.sc .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--outline); }
.sc .dots i.on { background: var(--text2r); }
.sc.on .dots i { background: rgba(16, 16, 18, .25); }
.sc.on .dots i.on { background: var(--on); }
.strip { flex: none; height: 44px; display: flex; gap: 4px; }
.strip .key { flex: 1 1 0; min-width: 0; height: 42px; padding: 0; font-size: 13px; }
.strip.hits .key[aria-pressed="true"] { background: var(--c); color: var(--on); } /* a hit: the track colour; a picked lane stays white */
.portrait .ruler .key { padding: 0 10px; }
.rtitle { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.rseg { flex: none; height: 36px; padding: 3px; }
.rseg .tab { flex: none; padding: 0 10px; font-size: 13px; }
/* drums by step: every lane's hit as a dot, bigger, since the dots are the content */
.g4.bystep .sc .dots { position: static; grid-template-columns: repeat(4, 9px); gap: 5px 6px; }
.g4.bystep .sc .dots i { width: 9px; height: 9px; }
.g4.bystep .sc .dots i.on { background: var(--c); }
/* the piano: one octave, white keys across and black keys over them */
.pianorow { flex: none; height: 76px; display: flex; gap: 4px; }
.pianorow .oct { flex: 0 0 32px; height: 74px; }
.piano { position: relative; flex: 1 1 auto; min-width: 0; }
.pk { position: absolute; top: 0; display: flex; align-items: flex-end; justify-content: center; font-weight: 600; transition: background-color var(--t-state), color var(--t-state); }
.pk.w { bottom: 2px; left: calc(var(--i) * 100% / 7 + 1px); width: calc(100% / 7 - 2px); padding-bottom: 6px; border-radius: 0 0 8px 8px; background: var(--held); color: var(--text); box-shadow: 0 2px 0 var(--edge); font-size: 12px; }
.pk.b { z-index: 2; height: 46px; width: calc(100% / 7 * .7); left: calc((var(--i) + 1) * 100% / 7 - 100% / 7 * .35); padding-bottom: 5px; border-radius: 0 0 6px 6px; background: var(--page); color: var(--text2r); box-shadow: inset 0 0 0 1px var(--outline), 0 2px 0 var(--edge); font-size: 11px; }
.pk:not(.in).w { background: var(--control); color: var(--text2r); }
.pk:not(.in).b { background: var(--edge); }
.pk.in::before { content: ""; position: absolute; top: 7px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: .75; }
.pk[aria-pressed="true"] { background: var(--c) !important; color: var(--on) !important; }
.pk:active { filter: brightness(1.15); }
.pk:disabled { opacity: .4; }

/* the step panel: in from the right, out quicker */
.insp {
  position: absolute; z-index: 5; top: 0; right: 0; bottom: 0; width: min(320px, 100%);
  display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow-y: auto;
  background: var(--panel); border-radius: 14px; box-shadow: 0 6px 16px rgba(0, 0, 0, .35);
  transform: translateX(calc(100% + 24px)); visibility: hidden;
  transition: transform 200ms var(--ease-in), visibility 0s linear 200ms;
}
.insp.open { transform: none; visibility: visible; transition: transform var(--t-panel) var(--ease-out), visibility 0s; }
.landscape .insp { top: 44px; }
.portrait .insp { left: 0; width: auto; border-radius: 16px; }
.ih { flex: none; display: flex; align-items: flex-start; gap: 4px; }
.ih .t { flex: 1 1 auto; min-width: 0; }
.ih small { display: block; font-size: 13px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ih b { display: block; margin-top: 4px; font-size: 20px; font-weight: 600; line-height: 1.2; }
.ih .key { flex: none; width: 40px; height: 40px; }
.ibody { display: flex; flex-direction: column; gap: 4px; }
.fields { display: grid; gap: 4px; }
.f2 { grid-template-columns: 1fr 1fr; }
.f4 { grid-template-columns: repeat(4, 1fr); }
.fld { position: relative; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 8px 10px 10px; background: var(--control); border-radius: 8px; }
.fl { font: 600 12px/1 var(--f-num); letter-spacing: .04em; color: var(--text2r); }
.fk { position: absolute; right: 8px; top: 6px; width: 18px; height: 18px; border-radius: 9px; background: var(--lifted); color: var(--text2r); font: 600 11px/18px var(--f-num); text-align: center; }
.fv { font: 600 22px/1.1 var(--f-num); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f4 .fv { font-size: 19px; }
.fb { height: 3px; border-radius: 2px; background: var(--bar); }
.fst { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.fst .fb { flex: 1 1 auto; }
.fsb { flex: none; width: 36px; height: 32px; font-size: 18px; }
.fld.adj { padding-bottom: 8px; }
.fb i { display: block; height: 100%; border-radius: 2px; background: var(--c); }
.ihint { margin: 4px 0 0; font-size: 13px; color: var(--text2r); line-height: 1.45; }
.ifoot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.txtb { height: 40px; font-weight: 600; font-size: 14px; color: var(--text); text-align: left; }
.ifoot .key { height: 40px; padding: 0 16px; }

/* Mix */
.mix { flex: 1 1 auto; min-height: 0; display: flex; gap: 8px; }
.msel { flex: 0 0 112px; display: flex; flex-direction: column; gap: 4px; }
.msel .key { flex: 1 1 0; max-height: 44px; min-height: 32px; font-size: 13px; }
.mpage { flex: 1 1 auto; min-width: 0; display: flex; }
.mrows { flex: 1 1 auto; min-width: 0; display: grid; grid-template-rows: repeat(6, minmax(28px, 1fr)); gap: 4px; }
.mrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mrow .nm { flex: 0 0 64px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fader { position: relative; flex: 1 1 auto; min-width: 0; height: 28px; border-radius: 8px; background: var(--control); overflow: hidden; }
.fader i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
.mdb { flex: 0 0 52px; text-align: right; font: 600 14px/1 var(--f-num); color: var(--text2r); }
.mnote { margin: auto; max-width: 36ch; text-align: center; color: var(--text2); font-size: 14px; line-height: 1.5; }

/* Sounds */
.sounds { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.sounds h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sounds h2 span { font-weight: 400; color: var(--text2); }
.slist { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px; align-content: start; padding-bottom: 2px; }
.slist .key { height: 44px; justify-content: flex-start; padding: 0 12px; }

/* menus open beside the finger */

    sub = LANES[S.lane];

      + fld('HIT', on ? 'On' : 'Off', on ? 1 : 0, 2, ['hit', on, !on, `Take the ${LANES[S.lane]} hit off step ${s + 1}`, `Put a ${LANES[S.lane]} hit on step ${s + 1}`])
      + fld('VELOCITY', on ? '100' : '—', on ? .79 : 0, 3) + fld('LENGTH', '1 step', 1 / 16, 4);
    if (!on) hint = built === 'portrait' ? 'No hit on this lane here. Use HIT +, or the lane keys under the grid.' : 'No hit here. Use HIT +, or tap its cell in the grid.';
  } else {
    const j = coverIdx(p.steps, s), n = j === s ? p.steps[s] : null;
    sub = n ? chordName(n) : j >= 0 ? `held from step ${j + 1}` : 'empty';
    const others = n ? p.steps.slice() : null; if (others) others[s] = null;
    const free = t2 => others && t2 >= 0 && t2 < 16 && !others[t2] && coverIdx(others, t2) < 0;
    const lo = ROWS[ROWS.length - 1], hi = ROWS[0];
    notes = fld(n && n.ms.length > 1 ? 'CHORD' : 'PITCH', n ? chordName(n) : '—', n ? (n.ms[0] - 53) / 22 : 0, 1, ['pitch', !!n && n.ms[0] > lo, !!n && n.ms[n.ms.length - 1] < hi, 'Pitch down a scale step', 'Pitch up a scale step'])
      + fld('MOVE', `Step ${s + 1}`, s / 15, 2, ['move', free(s - 1), free(s + 1), 'Move the note a step earlier', 'Move the note a step later'])
      + fld('LENGTH', n ? `${n.len} step${n.len > 1 ? 's' : ''}` : '—', n ? n.len / 16 : 0, 3, ['len', !!n && n.len > 1, !!n && n.len < maxLen(p.steps, s), 'Shorter', 'Longer'])
      + fld('VELOCITY', n ? String(n.vel) : '—', n ? n.vel / 127 : 0, 4, ['vel', !!n && n.vel > 1, !!n && n.vel < 127, 'Softer', 'Harder']);
    if (!n) hint = built === 'portrait' ? `Empty step. Tap it again in the grid to add ${nn(S.lastNote)}, or play a key on the piano.` : 'Empty step. Tap a cell in this step\'s column to add a note.';
  }
  const had = document.activeElement && R.iBody.contains(document.activeElement) && document.activeElement.dataset.adj
    ? `[data-adj="${document.activeElement.dataset.adj}"][data-d="${document.activeElement.dataset.d}"]` : null;
  R.ihT.innerHTML = `<small>T${S.sel + 1} ${t.name} · ${sub}</small><b>Step ${s + 1}</b>`;
  R.iBody.innerHTML = `<div class="fields f2">${notes}</div><div class="fields f4">${fld('CHANCE', '100%', 1)}${fld('RATCHET', '×1', .12)}${fld('COND', '—', 0)}${fld('NUDGE', '0', .5)}</div>`
    + (hint ? `<p class="ihint">${hint}</p>` : '')
    + `<div class="ifoot"><button class="txtb" title="Not in this mockup">Sound at this step ${ICON.down}</button><span class="spacer"></span><button class="key" data-lock aria-pressed="false">Lock</button></div>`;
  // keep keyboard focus on the − / + that was pressed (or its partner, if that end is reached)
  if (had) { const b = R.iBody.querySelector(had); const alt = R.iBody.querySelector(had.replace(/\[data-d="-?1"\]/, ':not(:disabled)')); const f = b && !b.disabled ? b : alt; if (f) f.focus({ preventScroll: true }); }
}

/* ---------- Mix ---------- */
function buildMix(host, withSel) {
  const wrap = h('div', { class: 'mix' });
  R.msel = null;
  if (withSel) {
    R.msel = h('div', { class: 'msel', role: 'group', 'aria-label': 'Mix pages' });
    ['Mixer', 'Delay', 'Reverb', 'Chorus', 'Global'].forEach(n => R.msel.append(h('button', { class: 'key', text: n, onclick: () => { S.mixPage = n; renderMixPage(); } })));
    wrap.append(R.msel);
  }
  R.mpage = h('div', { class: 'mpage' });
  wrap.append(R.mpage); host.append(wrap);
  renderMixPage();
}
function renderMixPage() {
  const page = R.msel ? S.mixPage : 'Mixer';
  if (R.msel) [...R.msel.children].forEach(b => b.setAttribute('aria-pressed', b.textContent === page));
  R.mpage.replaceChildren(); R.mix = null;
  if (page !== 'Mixer') { R.mpage.append(h('p', { class: 'mnote', text: `${page} isn't in this mockup. On the phone it's the iPad's ${page} card, filling this space.` })); return; }
  const rows = h('div', { class: 'mrows' });
  R.mix = TR.map((t, k) => {
    const lv = S.level[k];
    const num = h('button', { class: 'num', text: String(k + 1), 'aria-label': `Select track ${k + 1}, ${t.name}`, onclick: () => selectTrack(k) });
    const mute = h('button', { class: 'key mute', text: 'M', 'aria-label': `Mute ${t.name}`, onclick: () => toggleMute(k) });
    rows.append(h('div', { class: 'mrow', style: `--c:${t.c}` }, num, h('span', { class: 'nm', text: t.name }),
      h('div', { class: 'fader', role: 'img', 'aria-label': `${t.name} level ${db(lv)}`, html: `<i style="width:${lv}%"></i>` }), h('span', { class: 'mdb', text: db(lv), 'aria-hidden': 'true' }), mute));
    return { num, mute };
  });
  R.mpage.append(rows);
  updateMix();
}
function updateMix() {
  if (!R.mix) return;
  R.mix.forEach(({ num, mute }, k) => { num.classList.toggle('sel', S.sel === k); mute.setAttribute('aria-pressed', S.muted[k]); });
}

/* ---------- Sounds ---------- */
function buildSounds(host) { R.snd = h('div', { class: 'sounds' }); host.append(R.snd); renderSounds(); }
function renderSounds() {
  if (!R.snd) return;
  const k = S.sel, t = TR[k];
  const list = h('div', { class: 'slist', role: 'group', 'aria-label': `${t.name} ${t.eng}` });
  const keys = PRESETS[k].map((n, i) => h('button', { class: 'key', text: n, 'aria-pressed': S.sound[k] === i, onclick: () => { S.sound[k] = i; keys.forEach((b, x) => b.setAttribute('aria-pressed', x === i)); } }));
  list.append(...keys);
  R.snd.replaceChildren(h('h2', {}, `${k + 1} ${t.name}`, h('span', { text: ` · ${t.eng}` })), list);
  R.snd.style.animation = 'none'; void R.snd.offsetWidth; R.snd.style.animation = `fade var(--t-state) var(--ease-out)`;
}

/* ---------- menus at the finger ---------- */
function openPop(anchor, label, content) {
  closePop(true);
  const scrim = h('div', { class: 'scrim', onpointerdown: () => closePop() });
  const pop = h('div', { class: 'pop', role: 'dialog', 'aria-label': label }, content);
  document.body.append(scrim, pop);
  const a = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.max(16, Math.min(a.left + a.width / 2 - pw / 2, innerWidth - 16 - pw));
  let y = a.bottom + 8;
  if (y + ph > innerHeight - 8) y = Math.max(8, a.top - 8 - ph);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  R.pop = { pop, scrim, anchor };
  const first = pop.querySelector('button:not(:disabled)');
  if (first) first.focus({ preventScroll: true });
}
// a menu at the finger: just below the touch point (above it when there's no room), kept on screen
function openPopAt(fx, fy, anchor, label, content) {
  closePop(true);
  const scrim = h('div', { class: 'scrim', onpointerdown: () => closePop() });
  const pop = h('div', { class: 'pop', role: 'dialog', 'aria-label': label }, content);
  document.body.append(scrim, pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const x = Math.max(16, Math.min(fx - pw / 2, innerWidth - 16 - pw));
  let y = fy + 20, origin = 'top';
  if (y + ph > innerHeight - 8) { y = Math.max(8, fy - 20 - ph); origin = 'bottom'; }
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
  pop.style.transformOrigin = `${Math.round(fx - x)}px ${origin}`;
  R.pop = { pop, scrim, anchor };
  const first = pop.querySelector('button:not(:disabled)');
  if (first) first.focus({ preventScroll: true });
}
function closePop(now) {
  const p = R.pop; if (!p) return;
  R.pop = null; p.scrim.remove();
  if (now) { p.pop.remove(); return; }
  p.pop.classList.add('out'); setTimeout(() => p.pop.remove(), 150);
  if (p.anchor && p.anchor.isConnected) p.anchor.focus({ preventScroll: true });
}
function seg(options, current, onPick) {
  const w = h('div', { class: 'well' });
  const bs = options.map(o => h('button', { class: 'tab', text: o, 'aria-pressed': o === current, onclick: () => { bs.forEach(b => b.setAttribute('aria-pressed', b === bs[options.indexOf(o)])); onPick(o); } }));
  w.append(...bs); return w;
}
function openLaunchPop(anchor) {
  const info = h('p');
  const cancel = h('button', { class: 'key', text: 'Cancel waiting', onclick: () => { S.wait = S.wait.map(() => null); fill(); updatePads(); updateTop(); } });
  function fill() {
    const w = S.wait.map((x, k) => x == null ? null : `${TR[k].name} ${LET[x]}`).filter(Boolean);
    info.textContent = w.length ? `${w.length} waiting: ${w.join(', ')}. ${S.launch === 'Bar' ? 'They land at bar ' + (Math.floor(S.tick / 16) + 2) + '.' : ''}` : 'Nothing waiting. While playing, a pad you tap waits for the launch point.';
    cancel.disabled = !w.length;
  }
  fill();
  openPop(anchor, 'Launch', [h('span', { class: 'lab', text: 'LAUNCH AT' }), seg(['Loop', 'Bar', 'Beat', 'Now'], S.launch, o => { S.launch = o; fill(); updatePads(); updateTop(); }), info, cancel]);
}
function openTrackPop(anchor) {
  const rows = TR.map((t, k) => h('button', { class: 'prow', 'aria-current': S.sel === k, onclick: () => { selectTrack(k); closePop(); } },
    h('span', { class: 'rchip', style: `--c:${t.c}`, text: String(k + 1), 'aria-hidden': 'true' }), h('b', { text: t.name }), h('span', { text: t.kind === 'drum' ? 'drums' : 'synth' })));
  openPop(anchor, 'Tracks', [h('span', { class: 'lab', text: 'TRACK' }), ...rows]);
}
function openMorePop(anchor) {
  const pane = document.querySelector('.pane');
  const size = `${Math.round(innerWidth)} × ${Math.round(innerHeight)} px · ${built}` + (pane ? ` · each pane ${Math.round(pane.clientWidth)} × ${Math.round(pane.clientHeight)}` : '');
  const kids = [
    h('h3', { text: 'Lupe phone mockup' }),
    h('p', { text: 'Taps work, nothing talks to the FM-1. Rotate the phone to switch layouts. Hold a pad for its menu (Edit steps). In the step panel, − and + change pitch, move, length and velocity; the FEEL row is for show.' }),
    h('span', { class: 'lab', text: 'THIS SCREEN' }), h('span', { class: 'readout', text: size }),
    h('span', { class: 'lab', text: 'LAYOUT' }),
    seg(['Auto', 'Landscape', 'Portrait'], S.layout[0].toUpperCase() + S.layout.slice(1), o => { S.layout = o.toLowerCase(); closePop(true); build(); }),
  ];
  if (document.fullscreenEnabled) {
    const fs = h('button', { class: 'key', text: document.fullscreenElement ? 'Leave full screen' : 'Full screen', onclick: () => {
      const done = () => { closePop(true); setTimeout(sizePads, 300); };
      (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).then(done, () => { fs.disabled = true; fs.textContent = 'Full screen not allowed here'; });
    } });
    kids.push(fs);
  }
  openPop(anchor, 'Mockup info', kids);
}

/* ---------- build ---------- */
function build() {
  closePop(true);
  const L = layout();
  built = L; R = {};
  app.className = 'app ' + L + (L === 'portrait' && !mqP.matches ? ' narrow' : '');
  app.replaceChildren();
  if (L === 'landscape') {
    const top = buildTop(true);
    const stage = h('div', { class: 'stage' });
    R.slider = h('div', { class: 'slider' }); R.views = {};
    TABS.forEach(n => { R.views[n] = h('section', { class: 'view', id: 'view-' + n, role: 'tabpanel', 'aria-labelledby': 'tab-' + n }); R.slider.append(R.views[n]); });
    stage.append(R.slider); app.append(top, stage);
    buildPads(R.views.pads);
    const ed = h('div', { class: 'editor' }); R.views.edit.append(ed); buildEditorShell(ed); ed.append(buildInsp());
    buildMix(R.views.mix, true); buildSounds(R.views.sounds);
    setTab(S.tab, true);
  } else {
    const top = buildTop(false);
    const panes = h('div', { class: 'panes' });
    const up = h('section', { class: 'pane upper', 'aria-label': 'Pads, Mix and Sounds' });
    const lo = h('section', { class: 'pane lower', 'aria-label': 'Pattern steps' });
    const pt = h('div', { class: 'well tabs ptabs', role: 'tablist', 'aria-label': 'Upper screen' });
    R.tabs = {};
    PTABS.forEach(n => { R.tabs[n] = h('button', { class: 'tab', role: 'tab', id: 'tab-' + n, 'aria-controls': 'view-' + n, onclick: () => setPTab(n), text: n[0].toUpperCase() + n.slice(1) }); pt.append(R.tabs[n]); });
    const stage = h('div', { class: 'stage' });
    R.slider = h('div', { class: 'slider' }); R.views = {};
    PTABS.forEach(n => { R.views[n] = h('section', { class: 'view', id: 'view-' + n, role: 'tabpanel', 'aria-labelledby': 'tab-' + n }); R.slider.append(R.views[n]); });
    stage.append(R.slider); up.append(pt, stage);
    const ed = h('div', { class: 'editor' }); lo.append(ed); buildEditorShell(ed); lo.append(buildInsp());
    panes.append(up, lo); app.append(top, panes);
    buildPads(R.views.pads); buildMix(R.views.mix, false); buildSounds(R.views.sounds);
    setPTab(S.ptab, true);
  }
  refreshEditor(); updatePads(); updateTop();
  sizePads(); requestAnimationFrame(sizePads);
}

mqP.addEventListener('change', () => { if (S.layout === 'auto') build(); });
addEventListener('resize', () => requestAnimationFrame(sizePads));
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (R.pop) closePop(); else if (S.insp) setInsp(false, true);
});
document.fonts && document.fonts.ready.then(() => requestAnimationFrame(sizePads));
build();
})();
</script>
