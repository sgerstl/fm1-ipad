name: FM1
options:
  bundleIdPrefix: com.scottgerstl
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SloopKit:
    path: SloopKit
  SkiffDraw:                                   # decision 45's spike (2026-11-15): Skiff's own drawing code
    path: SkiffDraw
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K3CNX79952
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      # the phone's Developer submenu (Install firmware…) and a few debug tools are behind #if DEBUG
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  FM1:
    type: application
    platform: iOS
    sources:
      - path: FM1
        excludes: [LaunchScreen-Info.plist]     # merged into the Info.plist, not a resource
    dependencies:
      - package: SloopKit
      - package: SkiffDraw
        products: [SkiffDraw, SkiffDrawLink]
    postBuildScripts:
      # Debug only: copy the release firmware into the app so the installer works on a device without a GitHub
      # release (the repo is private, downloads 404). Release builds download as before. Added 2026-11-11.
      - name: Bundle release firmware (Debug)
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          dst="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/DebugFirmware"
          mkdir -p "$dst"
          cp "$SRCROOT/../firmware/releases/"*.fwsc "$dst/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottgerstl.fm1ipad
        ENABLE_USER_SCRIPT_SANDBOXING: NO       # the Debug firmware copy reads ../firmware/releases
        PRODUCT_NAME: FM1
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone too (2026-11-04), landscape only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lupe
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # projects live in Documents/Projects: shown in Files under On My iPad › Lupe (the Files folder takes the
        # app's display name; the bundle id and the FM1 target stay as they are)
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # the launch screen: Lupe's icon at home-screen size on #0A0A0B (merged into the generated Info.plist)
        INFOPLIST_FILE: FM1/LaunchScreen-Info.plist
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lupe plays the FM-1's sound through the iPad. iOS counts the FM-1's USB audio as a microphone."
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: [FM1UITests]
  # the accessibility audit (2026-11-10): XCUITest's performAccessibilityAudit on each main screen, against the demo
  # FM-1 (-demo); simulator only. Run: xcodebuild test -scheme FM1 -destination 'platform=iOS Simulator,name=A11y iPad'
  FM1UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FM1UITests
    dependencies:
      - target: FM1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottgerstl.fm1ipad.uitests
        PRODUCT_NAME: FM1UITests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FM1
