name: FM1
options:
  bundleIdPrefix: com.scottgerstl
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  SloopKit:
    path: SloopKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K3CNX79952
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      # the Developer menu (look switch, Install firmware…) is behind #if DEBUG
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
targets:
  FM1:
    type: application
    platform: iOS
    sources:
      - path: FM1
        excludes: [LaunchScreen-Info.plist]     # merged into the Info.plist, not a resource
    dependencies:
      - package: SloopKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottgerstl.fm1ipad
        PRODUCT_NAME: FM1
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone too (2026-11-04), landscape only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jib
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # projects live in Documents/Projects: shown in Files under On My iPad › Jib
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # the launch screen: Lupe's icon at home-screen size on #0A0A0B (merged into the generated Info.plist)
        INFOPLIST_FILE: FM1/LaunchScreen-Info.plist
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Jib plays the FM-1's sound through the iPad. iOS counts the FM-1's USB audio as a microphone."
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets: []
